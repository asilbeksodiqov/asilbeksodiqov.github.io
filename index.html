<script>
  // Chiziq qalinligi ekran kengligiga qarab moslanadi (telefonda ingichka bo'lib ketmasligi uchun)
  const svg = document.getElementById('sig');
  function weight() {
    const w = Math.max(2.6, 2 * 900 / svg.clientWidth);
    svg.querySelectorAll('.s').forEach(p => p.style.strokeWidth = p.classList.contains('w') ? w * 0.7 : w);
  }
  weight(); addEventListener('resize', weight);
</script>
